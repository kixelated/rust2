[package]
name = "rust2-driver"
description = "The rustc driver front end that rust2's drivers share, and rust2-lint"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moq-dev/rust2"
# A path dependency of the drivers, and rust2-lint through the flake: it only builds on
# their pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Its own workspace, apart from the repo's, on the drivers' nightly: rust-toolchain.toml
# links ts's pin, which flake.nix reads.
[workspace]

[lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"
