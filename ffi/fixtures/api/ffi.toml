package = "api-fixture"
prefix = "api"
# The list's tail is not `Clone`, so its getter has no copy to return, one instance leaves
# out a method the others keep, `Seed` is generic, so no callback implements it, `Payload`
# consumes itself, which no callback can, and
# `field@` leaves out a field alone where a method takes its path, as `Retry`'s and
# `Slot<u8>`'s do. `Slot<u32>` has no such method, so its path alone names its field. A
# function instance is left out by its path, as `depth_past` at `polar::Point` is.
exclude = [
    "Node::next",
    "Pair<u8, dep_fixture::Size>::swap",
    "Payload",
    "Seed",
    "Slot<u32>::value",
    "field@Retry::delay",
    "field@Slot<u8>::value",
    "Stack::depth_past<api_fixture::polar::Point>",
]

# The field `Retry::limit`, whose name its method takes.
[rename]
"field@Retry::limit" = "retry_limit_setting"

# Exported into the same library: `grow` names its types.
[crates.dep-fixture]
exclude = ["HashSet"]
