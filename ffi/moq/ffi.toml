[crates.hang.rename]
# The rule makes its accessors, such as `audio`, the `catalog` module's types:
# `moq_catalog_audio`.
"Catalog" = "hang_catalog"
# The rule names this and moq-net's `Error` alike.
"Error" = "hang_error"
# The rule makes both these enums and the `kind` methods of `AudioCodec` and `VideoCodec`
# `moq_catalog_<audio|video>_codec_kind`.
"catalog::AudioCodecKind" = "audio_codec_kind"
"catalog::VideoCodecKind" = "video_codec_kind"

