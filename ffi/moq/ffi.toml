[crates.moq-tokio.rename]
# The rule names these and moq-net's `Client`, `Server`, and `Error` alike.
"Client" = "tokio_client"
"Server" = "tokio_server"
"Error" = "tokio_error"
# The rule makes both this enum and `ConnectError` `moq_connect_error`.
"connect::Error" = "connect_target_error"
# The rule makes both this type and `Connection::monitor` `moq_connection_monitor`.
"connection::Monitor" = "monitor"

