package = "moq-net"
prefix = "moq"
# What the export refuses at the pinned revision, as `just ffi census` lists it: the API
# a hand-written wrapper still has to cover.
exclude = [
    "ALPNS",
    "AsPath",
    "Client::connect",
    "Client::with_publisher",
    "Consume",
    "Driver::poll",
    "Epoch::time",
    "Error::from_transport",
    "Hops::as_slice",
    "Hops::iter",
    "IntoBytes",
    "InvalidPattern",
    "Path::borrow",
    "Path::new",
    "Path::next_part",
    "Path::parts",
    "Path::strip_prefix",
    "Pattern",
    "Patterns",
    "Server::accept",
    "Server::accept_request",
    "Server::with_publisher",
    "Timed",
    "Timestamp::as_micros",
    "Timestamp::as_millis",
    "Timestamp::as_nanos",
    "Timestamp::as_scale",
    "Version::names",
    "Versions::alpns",
    "Versions::iter",
    "announce::Announce::captures",
    "announce::Consumer::absolute",
    "announce::Consumer::root",
    "auth::Grant::expires",
    "auth::Grant::publish",
    "auth::Grant::subscribe",
    "broadcast::Finish::poll_closed",
    "broadcast::Lister::poll_unused",
    "broadcast::Lister::poll_used",
    "bytes",
    "cache::Pool::gc",
    "frame::Buffer",
    "frame::Frame::arrived",
    "frame::Producer::group",
    "goaway::Consumer::poll",
    "group::Consumer::poll_read_frames",
    "group::Consumer::read_frames",
    "group::Producer::write_frames",
    "kio",
    "origin::Consumer::absolute",
    "origin::Consumer::allowed",
    "origin::Consumer::root",
    "origin::Consumer::scope",
    "origin::Driver::poll",
    "origin::Producer::absolute",
    "origin::Producer::allowed",
    "origin::Producer::root",
    "origin::Producer::scope",
    "origin::Request::path",
    "origin::Requesting::poll_ok",
    "path::Relative::borrow",
    "path::Relative::new",
    "path::Segment",
    "path::Specificity",
    "server::Handshake::with_publisher",
    "stats::Config::exclude",
    "stats::Config::with_exclude",
    "stats::Failure::ALL",
    "stats::Refusal::ALL",
    "stats::Registry::exclude",
    "stats::Report::sessions",
    "stats::Report::traffic",
    "stats::Snapshot::control",
    "stats::Snapshot::sessions",
    "stats::Snapshot::traffic",
    "time::Driver",
    "time::Instant",
    "time::now",
    "time::run",
    "track::Querying::poll_ok",
    "track::Subscribing::poll_ok",
    "track::Subscription::ranges",
    "track::Subscription::with_ranges",
    "transport::Error",
    "transport::MaybeSend",
    "transport::MaybeSync",
    "transport::poll::AcceptBi",
    "transport::poll::AcceptUni",
    "transport::poll::Boxable",
    "transport::poll::Buffered",
    "transport::poll::Chunks",
    "transport::poll::Lease",
    "transport::poll::OpenBi",
    "transport::poll::OpenUni",
    "transport::poll::ReadChunk",
    "transport::poll::RecvDatagram",
    "transport::poll::RecvStream",
    "transport::poll::SendClosed",
    "transport::poll::SendGroup",
    "transport::poll::SendOptions",
    "transport::poll::SendStream",
    "transport::poll::Session",
    "transport::poll::SessionClosed",
    "transport::poll::Ungrouped",
    "transport::poll::Write",
    "transport::poll::WriteBuf",
    "transport::poll::WriteChunk",
    "varint::decode_quic",
    "varint::encode_quic",
]

[rename]
# The rule makes both this type and `Session::stats` `moq_session_stats`.
"session::Stats" = "session_stats_snapshot"
# The rule makes both this type and `Path::relative` `moq_path_relative`.
"path::Relative" = "relative"
