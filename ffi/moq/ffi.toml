package = "moq-ffi"
prefix = "moq"

# moq-net, and each package below, exported into one library through the stand-in for
# moq-ffi's remainder that `just ffi standin` writes, which builds with them all.
[crates.moq-net]
# What the export refuses at the pinned revision, as `just ffi census` lists it: the API
# a hand-written wrapper still has to cover.
exclude = [
    "ALPNS",
    "AsPath",
    "BoundsExceeded",
    "Client::connect",
    "Client::with_url",
    "Consume",
    "DecodeError",
    "Driver",
    "Hops::as_slice",
    "Hops::iter",
    "IntoBytes",
    "InvalidEpoch",
    "Path::borrow",
    "Path::new",
    "Path::parts",
    "Path::strip_prefix",
    "Server::accept",
    "Server::accept_request",
    "Timed",
    "Timestamp::as_micros",
    "Timestamp::as_millis",
    "Timestamp::as_nanos",
    "Timestamp::as_scale",
    "Versions::alpns",
    "Versions::iter",
    "announce::Announce",
    "announce::Consumer::poll_synced",
    "bytes",
    "cache::Pool::poll",
    "frame::Buffer",
    "frame::Producer::group",
    "goaway::Consumer::poll",
    "group::Consumer::poll_read_frames",
    "group::Consumer::read_frames",
    "group::Producer::write_frames",
    "kio",
    "origin::Driver::poll",
    "origin::Requesting",
    "origin::Routing",
    "path::Relative::borrow",
    "path::Relative::new",
    "server::Handshake",
    "stats::Failure::ALL",
    "stats::RefusalKind::ALL",
    "stats::Report::sessions",
    "stats::Report::traffic",
    "stats::SessionEntry",
    "stats::Snapshot::control",
    "stats::Snapshot::sessions",
    "stats::Snapshot::traffic",
    "stats::TrafficEntry",
    "time::Driver",
    "track::Fetching",
    "track::Querying",
    "track::Subscribing",
    "track::Subscription::ranges",
    "track::Subscription::with_ranges",
    "transport::Error",
    "transport::MaybeSend",
    "transport::MaybeSync",
    "transport::StatsUnavailable",
    "transport::memory::Chunks",
    "transport::memory::SendStream",
    "transport::poll::AcceptBi",
    "transport::poll::AcceptUni",
    "transport::poll::Boxable",
    "transport::poll::Buffered",
    "transport::poll::BufferedLease",
    "transport::poll::Chunks",
    "transport::poll::Lease",
    "transport::poll::OpenBi",
    "transport::poll::OpenUni",
    "transport::poll::ReadChunk",
    "transport::poll::RecvDatagram",
    "transport::poll::RecvStream",
    "transport::poll::SendClosed",
    "transport::poll::SendGroup",
    "transport::poll::SendOptions",
    "transport::poll::SendStream",
    "transport::poll::Session",
    "transport::poll::SessionClosed",
    "transport::poll::Ungrouped",
    "transport::poll::Write",
    "transport::poll::WriteBuf",
    "transport::poll::WriteChunk",
    "varint::decode_quic",
    "varint::encode_quic",
]

[crates.moq-net.rename]
# The rule makes both this type and `Session::stats` `moq_session_stats`.
"session::Stats" = "session_stats_snapshot"
# The rule makes both this type and `Path::relative` `moq_path_relative`.
"path::Relative" = "relative"

# Exported with moq-net, whose signatures name their types, such as `Patterns` and `Instant`.
[crates.moq-pattern]
exclude = ["Pattern::captures", "Pattern::new", "Pattern::segments", "Patterns::iter"]

[crates.moq-clock]
exclude = [
    "Deadline::poll",
    "Deadlines::enter",
    "Deadlines::park",
    "Elapsed",
    "Entered",
    "Instant::from_std",
    "Instant::into_std",
    "OutOfRange",
    "Sleep",
    "Timeout",
    "drive",
    "timeout",
    "timeout_at",
]

[crates.moq-clock.rename]
# The rule makes both this function and the type `Wall` `moq_wall`.
"wall" = "now_wall"
# The rule makes both this function and the type `Interval` `moq_interval`.
"interval" = "interval_every"

