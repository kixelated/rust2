[package]
name = "uniffi-bindgen-go-fixtures"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
name = "uniffi_fixtures"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Examples
uniffi-example-arithmetic = { path = "../../examples/arithmetic"}
uniffi-example-callbacks = { path = "../../examples/callbacks"}
uniffi-example-custom-types = { path = "../../examples/custom-types"}
uniffi-example-geometry = { path = "../../examples/geometry"}
uniffi-example-rondpoint = { path = "../../examples/rondpoint"}
uniffi-example-sprites = { path = "../../examples/sprites"}
uniffi-example-todolist = { path = "../../examples/todolist"}
uniffi-example-traits = { path = "../../examples/traits"}
uniffi-example-futures = { path = "../../examples/futures"}

# Fixtures
# NOTE: taken from upstream, due to collision between new_megaphone and Megaphone interface constructor names
# uniffi-fixture-futures = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.32.0"}
uniffi-go-fixture-futures = { path = "./futures" }


uniffi-fixture-callbacks = { path = "../../fixtures/callbacks"}
uniffi-fixture-coverall = { path = "../../fixtures/coverall"}
uniffi-fixture-docstring = { path = "../../fixtures/docstring"}
uniffi-fixture-enum-types = { path = "../../fixtures/enum-types"}
uniffi-fixture-error-types = { path = "../../fixtures/error-types"}
uniffi-fixture-ext-types-custom-types = { path = "../../fixtures/ext-types/custom-types"}
uniffi-fixture-ext-types = { path = "../../fixtures/ext-types/lib"}
uniffi-fixture-ext-types-lib-one = { path = "../../fixtures/ext-types/uniffi-one"}
uniffi-fixture-ext-types-proc-macro = { path = "../../fixtures/ext-types/proc-macro-lib"}
uniffi-fixture-large-enum = { package = "large-enum", path = "../../fixtures/large-enum"}
uniffi-fixture-large-error = { package = "large-error", path = "../../fixtures/large-error"}
uniffi-fixture-namespaces-media = { path = "../../fixtures/namespaces/media"}
uniffi-fixture-namespaces-net = { path = "../../fixtures/namespaces/net"}
uniffi-fixture-proc-macro = { path = "../../fixtures/proc-macro"}
uniffi-fixture-simple-fns = { path = "../../fixtures/simple-fns"}
uniffi-fixture-simple-iface = { path = "../../fixtures/simple-iface"}
uniffi-fixture-time = { path = "../../fixtures/uniffi-fixture-time"}
uniffi-fixture-trait-methods = { path = "../../fixtures/trait-methods"}
uniffi-fixture-type-limits = { path = "../../fixtures/type-limits"}

# Go specific
uniffi-go-fixture-destroy = { path = "destroy" }
uniffi-go-fixture-errors = { path = "errors" }
uniffi-go-fixture-issue43 = { path = "regressions/issue43" }
uniffi-go-fixture-issue45 = { path = "regressions/issue45" }
uniffi-go-fixture-name-case = { path = "name-case" }
uniffi-go-fixture-objects = { path = "objects" }
uniffi-go-fixture-empty-string-and-bytes = { path = "empty_string_and_bytes"}
