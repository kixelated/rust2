[package]
name = "uniffi_pipeline"
version = "0.1.0"
publish = false
description = "A hard fork of UniFFI: a multi-language bindings generator for rust (codegen and cli tooling)"
homepage = "https://github.com/kixelated/rust2/tree/main/uniffi"
repository = "https://github.com/kixelated/rust2"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[dependencies]
anyhow = "1"
heck = "0.5"
indexmap = { version = "2.2" }
tempfile = "3"
uniffi_internal_macros = { path = "../uniffi_internal_macros", version = "=0.1.0" }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
