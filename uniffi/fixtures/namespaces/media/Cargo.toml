[package]
name = "uniffi-fixture-namespaces-media"
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "uniffi_namespaces_media"

[dependencies]
thiserror = "2"
uniffi = { workspace = true }
uniffi-fixture-namespaces-net = { path = "../net" }

[dev-dependencies]
uniffi = { workspace = true, features = ["bindgen-tests"] }

[features]
ffi-trace = ["uniffi/ffi-trace", "uniffi-fixture-namespaces-net/ffi-trace"]
