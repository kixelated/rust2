[package]
name = "rust2-uniffi-bindgen"
version = "0.1.0"
description = "A hard fork of UniFFI: a multi-language bindings generator for rust (codegen and cli tooling)"
homepage = "https://github.com/kixelated/rust2/tree/main/uniffi"
repository = "https://github.com/kixelated/rust2"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[lib]
name = "uniffi_bindgen"

[features]
default = ["cargo-metadata"]
cargo-metadata = ["dep:cargo_metadata"]
bindgen-tests = ["cargo-metadata", "dep:uniffi_testing"]
ffi-trace = ["uniffi_testing?/ffi-trace"]

[dependencies]
anyhow = "1"
askama = { version = "0.16.0", default-features = false, features = ["config", "derive", "alloc"] }
camino = "1.0.8"
cargo_metadata = { version = "0.23.1", optional = true }
fs-err = "3.3.0"
glob = "0.3"
goblin = "0.8"
heck = "0.5"
indexmap = { version = "2.2", features = ["serde"] }
once_cell = "1.12"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
uniffi_internal_macros = { package = "rust2-uniffi-internal-macros", path = "../uniffi_internal_macros", version = "=0.1.0" }
uniffi_pipeline = { package = "rust2-uniffi-pipeline", path = "../uniffi_pipeline", version = "=0.1.0" }
uniffi_meta = { package = "rust2-uniffi-meta", path = "../uniffi_meta", version = "=0.1.0" }
uniffi_testing = { package = "rust2-uniffi-testing", path = "../uniffi_testing", version = "=0.1.0", optional = true }
uniffi_udl = { package = "rust2-uniffi-udl", path = "../uniffi_udl", version = "=0.1.0" }
# Don't include the `unicode-linebreak` or `unicode-width` since that functionality isn't needed for
# docstrings.
textwrap = { version = "0.16", features=["smawk"], default-features = false }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
