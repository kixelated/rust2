[package]
name = "dart_namespaces"
version = "0.1.0"
edition = "2021"
publish = false

# One library holding both crates of the namespaces fixture, which share their type names.
[lib]
name = "dart_namespaces"
crate-type = ["lib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
uniffi-fixture-namespaces-media = { path = "../../../fixtures/namespaces/media" }
uniffi-fixture-namespaces-net = { path = "../../../fixtures/namespaces/net" }

[dev-dependencies]
uniffi-dart = { path = "../../", features = ["bindgen-tests"] }
uniffi = { workspace = true, features = ["bindgen-tests"] }
anyhow = "1"

[features]
ffi-trace = [
  "uniffi/ffi-trace",
  "uniffi-fixture-namespaces-media/ffi-trace",
  "uniffi-fixture-namespaces-net/ffi-trace",
]
