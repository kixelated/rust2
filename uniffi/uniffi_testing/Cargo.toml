[package]
name = "uniffi_testing"
version = "0.1.0"
publish = false
description = "A hard fork of UniFFI: a multi-language bindings generator for rust (testing helpers)"
homepage = "https://github.com/moq-dev/rust2/tree/main/uniffi"
repository = "https://github.com/moq-dev/rust2"
edition = "2021"
license = "MPL-2.0"
readme = "../README.md"

[dependencies]
anyhow = "1"
camino = "1.0.8"
cargo_metadata = "0.23.1"
fs-err = "3.3.0"
once_cell = "1.12"

[features]
ffi-trace = []

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
