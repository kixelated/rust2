[workspace]
# Only the UniFFI fork's crates publish. Fixtures and generators stay in the repository,
# and the generators ship from the tag instead.
release = false
dependencies_update = true
git_release_enable = false
git_tag_enable = false
changelog_update = false

# The fork releases as one version under one tag, with one changelog.
[[package]]
name = "rust2-uniffi"
release = true
version_group = "uniffi"
git_tag_enable = true
git_tag_name = "uniffi-v{{ version }}"
changelog_update = true
changelog_include = [
    "rust2-uniffi-bindgen",
    "rust2-uniffi-build",
    "rust2-uniffi-core",
    "rust2-uniffi-internal-macros",
    "rust2-uniffi-macros",
    "rust2-uniffi-meta",
    "rust2-uniffi-pipeline",
    "rust2-uniffi-testing",
    "rust2-uniffi-udl",
]

[[package]]
name = "rust2-uniffi-bindgen"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-build"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-core"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-internal-macros"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-macros"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-meta"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-pipeline"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-testing"
release = true
version_group = "uniffi"

[[package]]
name = "rust2-uniffi-udl"
release = true
version_group = "uniffi"
