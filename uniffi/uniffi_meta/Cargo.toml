[package]
name = "rust2-uniffi-meta"
version = "0.1.0"
edition = "2021"
description = "A hard fork of UniFFI: uniffi_meta"
homepage = "https://github.com/kixelated/rust2/tree/main/uniffi"
repository = "https://github.com/kixelated/rust2"
license = "MPL-2.0"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[lib]
name = "uniffi_meta"

[dependencies]
anyhow = "1"
siphasher = "1"
uniffi_internal_macros = { package = "rust2-uniffi-internal-macros", version = "=0.1.0", path = "../uniffi_internal_macros" }
uniffi_pipeline = { package = "rust2-uniffi-pipeline", version = "=0.1.0", path = "../uniffi_pipeline" }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
