[package]
name = "uniffi-bindgen-cpp-fixtures"
version = "1.0.0"
publish = false
edition = "2021"

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[dependencies]
async-trait = "0.1"
uniffi = { workspace = true }
uniffi-example-arithmetic = { path = "../../examples/arithmetic" }
uniffi-example-callbacks = { path = "../../examples/callbacks" }
uniffi-example-custom-types = { path = "../../examples/custom-types" }
uniffi-example-geometry = { path = "../../examples/geometry" }
uniffi-example-rondpoint = { path = "../../examples/rondpoint" }
uniffi-example-sprites = { path = "../../examples/sprites" }
uniffi-example-todolist = { path = "../../examples/todolist" }
uniffi-example-traits = { path = "../../examples/traits" }
uniffi-fixture-callbacks = { path = "../../fixtures/callbacks" }
uniffi-fixture-coverall = { path = "../../fixtures/coverall" }
uniffi-fixture-docstring = { path = "../../fixtures/docstring" }
uniffi-fixture-time = { path = "../../fixtures/uniffi-fixture-time" }
uniffi-fixture-trait-methods = { path = "../../fixtures/trait-methods" }

uniffi-async-calls = { path = "async-calls" }
uniffi-c-api = { path = "c-api" }
uniffi-error-types-builtin = { path = "error-types-builtin" }
uniffi-custom-types-builtin = { path = "custom-types-builtin" }
uniffi-enum-style-test = { path = "enum-style-test" }
uniffi-empty-type = { path = "empty-type" }
uniffi-reserved-field-name = { path = "reserved-field-name" }
uniffi-type-flattening = { path = "type-flattening" }

uniffi-ext-types-export = { path = "ext-types-export" }
uniffi-ext-types-import = { path = "ext-types-import" }
