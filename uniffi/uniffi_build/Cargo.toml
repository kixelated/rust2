[package]
name = "uniffi_build"
version = "0.1.0"
publish = false
description = "A hard fork of UniFFI: a multi-language bindings generator for rust (build script helpers)"
homepage = "https://github.com/kixelated/rust2/tree/main/uniffi"
repository = "https://github.com/kixelated/rust2"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[dependencies]
anyhow = "1"
camino = "1.0.8"
uniffi_bindgen = { path = "../uniffi_bindgen", default-features = false, version = "=0.1.0" }

[features]
default = []
# Deprecated feature that doesn't do anything anymore, but we still allow for backwards-compatibility.
builtin-bindgen = []

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
