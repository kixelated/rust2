[workspace]
# Its own workspace, apart from the repo's, so the fork keeps upstream's layout, lints,
# and formatting, and its fixtures stay out of the other projects' lockfiles.
members = [
    "bindgen-tests/external-types",
    "bindgen-tests/kotlin",
    "bindgen-tests/kotlin/enum-payload-clash",
    "bindgen-tests/kotlin/experimental-unsigned-types",
    "bindgen-tests/kotlin/keywords",
    "bindgen-tests/lib",
    "bindgen-tests/python",
    "bindgen-tests/swift",
    "bindgen-tests/swift/bridging-header-compile",
    "bindgen-tests/swift/callbacks-omit-labels",
    "bindgen-tests/swift/codable",
    "bindgen-tests/swift/dictionary-nesting",
    "bindgen-tests/swift/keywords",
    "bindgen-tests/swift/link-frameworks",
    "bindgen-tests/swift/mock-objects",
    "bindgen-tests/swift/omit-labels",
    "cpp/bindgen",
    "cpp/fixtures",
    "cpp/fixtures/async-calls",
    "cpp/fixtures/c-api",
    "cpp/fixtures/custom-types-builtin",
    "cpp/fixtures/empty-type",
    "cpp/fixtures/enum-style-test",
    "cpp/fixtures/error-types-builtin",
    "cpp/fixtures/ext-types-export",
    "cpp/fixtures/ext-types-import",
    "cpp/fixtures/reserved-field-name",
    "cpp/fixtures/type-flattening",
    "dart",
    "dart/fixtures/arithmetic",
    "dart/fixtures/benchmarks",
    "dart/fixtures/bytes_types",
    "dart/fixtures/callbacks",
    "dart/fixtures/custom_types",
    "dart/fixtures/dart_async",
    "dart/fixtures/docstring-proc-macro",
    "dart/fixtures/duration_type_test",
    "dart/fixtures/enum_variant_collision",
    "dart/fixtures/hello_world",
    "dart/fixtures/library_config",
    "dart/fixtures/map_type",
    "dart/fixtures/metadata",
    "dart/fixtures/proc-macro",
    "dart/fixtures/proc-macro-no-implicit-prelude",
    "dart/fixtures/simple-fns",
    "dart/fixtures/simple-iface",
    "dart/fixtures/streams_ext",
    "dart/fixtures/struct-default-values",
    "dart/fixtures/trait-interfaces",
    "dart/fixtures/trait-methods",
    "dart/fixtures/type-limits",
    "dart/uniffi_dart_macro",
    "examples/arithmetic",
    "examples/arithmetic-procmacro",
    "examples/async-api-client",
    "examples/callbacks",
    "examples/custom-types",
    "examples/futures",
    "examples/geometry",
    "examples/remote-types",
    "examples/rondpoint",
    "examples/sprites",
    "examples/todolist",
    "examples/traits",
    "fixtures/benchmarks",
    "fixtures/callbacks",
    "fixtures/coverall",
    "fixtures/docstring",
    "fixtures/docstring-proc-macro",
    "fixtures/enum-types",
    "fixtures/error-types",
    "fixtures/ext-types/custom-types",
    "fixtures/ext-types/external-crate",
    "fixtures/ext-types/http-headermap",
    "fixtures/ext-types/lib",
    "fixtures/ext-types/proc-macro-lib",
    "fixtures/ext-types/sub-lib",
    "fixtures/ext-types/uniffi-one",
    "fixtures/futures",
    "fixtures/gh-2600",
    "fixtures/keywords/rust",
    "fixtures/large-enum",
    "fixtures/large-error",
    "fixtures/metadata",
    "fixtures/multi-arch-extract",
    "fixtures/mutable-records",
    "fixtures/proc-macro",
    "fixtures/proc-macro-no-implicit-prelude",
    "fixtures/regressions/cdylib-crate-type-dependency/cdylib-dependency",
    "fixtures/regressions/cdylib-crate-type-dependency/ffi-crate",
    "fixtures/regressions/enum-without-i32-helpers",
    "fixtures/regressions/fully-qualified-types",
    "fixtures/regressions/logging-callback-interface",
    "fixtures/regressions/missing-newline",
    "fixtures/regressions/unary-result-alias",
    "fixtures/regressions/wrong-lower-check",
    "fixtures/rename",
    "fixtures/simple-fns",
    "fixtures/simple-iface",
    "fixtures/struct-default-values",
    "fixtures/trait-methods",
    "fixtures/type-limits",
    "fixtures/uitests",
    "fixtures/uniffi-fixture-time",
    "fixtures/version-mismatch",
    "fixtures/wasm-unstable-single-threaded",
    "go/bindgen",
    "go/fixtures",
    "go/fixtures/destroy",
    "go/fixtures/empty_string_and_bytes",
    "go/fixtures/errors",
    "go/fixtures/futures",
    "go/fixtures/name-case",
    "go/fixtures/objects",
    "go/fixtures/regressions/issue43",
    "go/fixtures/regressions/issue45",
    "uniffi",
    "uniffi_bindgen",
    "uniffi_build",
    "uniffi_core",
    "uniffi_internal_macros",
    "uniffi_macros",
    "uniffi_meta",
    "uniffi_pipeline",
    "uniffi_testing",
    "uniffi_udl",
]
resolver = "2"

# The UniFFI fork's crates are renamed on crates.io, but keep their upstream
# names in code so cherry-picks from upstream apply unchanged.
[workspace.dependencies]
uniffi = { package = "rust2-uniffi", path = "uniffi", version = "=0.1.0" }
uniffi_bindgen = { package = "rust2-uniffi-bindgen", path = "uniffi_bindgen", version = "=0.1.0" }
uniffi_core = { package = "rust2-uniffi-core", path = "uniffi_core", version = "=0.1.0" }
uniffi_macros = { package = "rust2-uniffi-macros", path = "uniffi_macros", version = "=0.1.0" }
uniffi_build = { package = "rust2-uniffi-build", path = "uniffi_build", version = "=0.1.0" }
uniffi_meta = { package = "rust2-uniffi-meta", path = "uniffi_meta", version = "=0.1.0" }
uniffi_testing = { package = "rust2-uniffi-testing", path = "uniffi_testing", version = "=0.1.0" }
uniffi_udl = { package = "rust2-uniffi-udl", path = "uniffi_udl", version = "=0.1.0" }
