[package]
name = "rust2-uniffi-udl"
version = "0.1.0"
description = "A hard fork of UniFFI: udl parsing for the uniffi project"
homepage = "https://github.com/kixelated/rust2/tree/main/uniffi"
repository = "https://github.com/kixelated/rust2"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]
readme = "../README.md"

[lib]
name = "uniffi_udl"

[dependencies]
anyhow = "1"
weedle2 = "5.0.0"
# Don't include the `unicode-linebreak` or `unicode-width` since that functionality isn't needed for
# docstrings.
textwrap = { version = "0.16", features = ["smawk"], default-features = false }
uniffi_meta = { package = "rust2-uniffi-meta", path = "../uniffi_meta", version = "=0.1.0" }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
