# What `just bench` builds and how. Changing a rev, lock, or args is a corpus
# bump: land it on its own so numbers on either side of it are not compared.

# `args` selects what each scenario builds. `leaf` and `hub` are the crate roots
# the incremental scenarios edit: a crate nothing in the build depends on, and
# one most of the build depends on. `pure` fails the run if any crate in the
# build has a build script or links native code; `no-c` allows pure-Rust build
# scripts but fails on native links and on the cc and cmake crates.

[[corpus]]
name = "moq"
git = "https://github.com/moq-dev/moq"
rev = "f36c8482066bb5704d02d7cf7ea5350f5f78e025"
args = ["-p", "moq-relay"]
leaf = "rs/moq-relay/src/lib.rs"
hub = "rs/moq-net/src/lib.rs"

# The moq corpus's rev plus moq-dev/moq's spike/pure-crypto branch, which moves
# moq-relay's crypto off aws-lc-rs onto graviola and RustCrypto. Compare it with moq.
[[corpus]]
name = "moq-pure-crypto"
git = "https://github.com/moq-dev/moq"
rev = "fd53b86f6d3fd2b3d40be5e0c8c00f77f464c149"
args = ["-p", "moq-relay"]
leaf = "rs/moq-relay/src/lib.rs"
hub = "rs/moq-net/src/lib.rs"
no-c = true

[[corpus]]
name = "regex"
git = "https://github.com/rust-lang/regex"
rev = "80b9d14e4be9f0b703a742d11c064abce05f210b"
# The repository commits no lockfile, and its dev profile optimizes to speed
# up its tests; build it at cargo's default debug opt-level instead.
lock = "regex.Cargo.lock"
args = ["-p", "regex", "--config", "profile.dev.opt-level=0"]
leaf = "src/lib.rs"
hub = "regex-syntax/src/lib.rs"
pure = true

[[corpus]]
name = "wasmparser"
git = "https://github.com/bytecodealliance/wasm-tools"
rev = "8c7a8e6404d8f4612d975fa8943a796ecc18019c"
# The default features minus serde, whose build script makes the graph impure.
args = ["-p", "wasmparser", "--no-default-features", "--features", "std,validate,features,component-model,hash-collections,simd"]
leaf = "crates/wasmparser/src/lib.rs"
pure = true

# Each variant is one build configuration. `base` names the variant it is
# compared against; a variant without one is a base. `rustflags` replaces any
# host rustflags the corpus configures (none do today). `subcommand` goes between
# cargo and `build` or `check`. `corpora` and `scenarios` limit a variant to those
# they list, which its base must run too.

[[variant]]
name = "baseline"
toolchain = "stable"

[[variant]]
name = "mold"
base = "baseline"
toolchain = "stable"
rustflags = "-C link-arg=-fuse-ld=mold"

[[variant]]
name = "wild"
base = "baseline"
toolchain = "stable"
rustflags = "-C link-arg=-fuse-ld=wild"

# A/A control: identical to its base, so its delta is the run's noise.
[[variant]]
name = "control"
base = "baseline"
toolchain = "stable"

[[variant]]
name = "nightly"
toolchain = "nightly"

[[variant]]
name = "jobs-frontend"
base = "nightly"
toolchain = "nightly"
rustflags = "-Z unstable-options --jobs-frontend=8"

[[variant]]
name = "cranelift"
base = "nightly"
toolchain = "nightly"
rustflags = "-Z codegen-backend=cranelift"

[[variant]]
name = "cache-proc-macros"
base = "nightly"
toolchain = "nightly"
rustflags = "-Z cache-proc-macros"

[[variant]]
name = "nightly-control"
base = "nightly"
toolchain = "nightly"

# ra-jit keeps the workspace loaded in a daemon on rust-analyzer, and after an edit
# compiles only the changed functions with Cranelift and splices them into the
# program cargo linked, handing the build to cargo when it cannot. It works with
# one rustc only, so its base is plain cargo on that toolchain. It loads a program,
# and on a library corpus `cargo ra-jit build` returns without building anything.
# Neither checks: with no build loaded, `cargo ra-jit check` reads every crate of
# the workspace, tests included, and on moq it takes minutes to report errors
# rustc does not.
[[variant]]
name = "ra-jit-baseline"
toolchain = "ra-jit"
corpora = ["moq", "moq-pure-crypto"]
scenarios = ["build", "edit-leaf", "edit-hub"]

[[variant]]
name = "ra-jit"
base = "ra-jit-baseline"
toolchain = "ra-jit"
subcommand = "ra-jit"
corpora = ["moq", "moq-pure-crypto"]
scenarios = ["build", "edit-leaf", "edit-hub"]
