# What `just bench-nix` builds. Changing any of it is a corpus bump: land it on
# its own so numbers on either side of it are not compared.

# moq at its own pin, since crane's dependency layer fails to build at the moq
# corpus's rev. `packages` build in order, the second after the first. `hub` is
# the crate root the edit scenario edits, and `bump` the `cargo update`
# arguments of the lockfile scenario.
git = "https://github.com/moq-dev/moq"
rev = "011402e005f6c8efeff07c46535fa2cfa95f021e"
packages = ["moq-relay", "moq-cli"]
hub = "rs/moq-net/src/lib.rs"
bump = ["-p", "hyper", "--precise", "1.12.0"]
