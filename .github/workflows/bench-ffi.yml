name: Bench FFI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  # A change to the fork measures its effect against the PR's base, and a change to
  # the benchmark or its toolchains reports its numbers, before either merges.
  pull_request:
    paths:
      - uniffi/**
      - Cargo.toml
      - Cargo.lock
      - bench/ffi/**
      - .github/workflows/bench-ffi.yml
      - flake.nix
      - flake.lock
      - rust-toolchain.toml

concurrency:
  group: bench-ffi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench FFI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Each job measures its own Rust baselines, so ratios never cross machines.
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Swift
            os: macos-latest
            args: --runner swift

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --base needs the PR's base commit.
          fetch-depth: 0

      - uses: ./.github/actions/nix

      - name: Bench
        run: nix develop --command just bench-ffi ${{ matrix.args }} ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }} --out bench-results
        env:
          # The pinned moq's flake names its binary cache; without it the dev shell builds from source.
          NIX_CONFIG: accept-flake-config = true

      - name: Summary
        run: cat bench-results/report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-ffi-${{ strategy.job-index }}
          path: bench-results
          if-no-files-found: ignore
