name: Check

permissions:
  contents: read

# PRs land through the host land gate (`quest land serve` on the maintainer's
# host), which runs `just ci` once over each batch. This workflow stays for a
# manual run on a hosted runner.
on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Check
        run: nix develop --command just ci
