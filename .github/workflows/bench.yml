name: Bench

permissions:
  contents: read

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  # A change to the benchmark or its toolchains reports its numbers before it merges.
  pull_request:
    paths:
      - bench/build/**
      - "!bench/build/**/*.md"
      - .github/workflows/bench.yml
      - flake.nix
      - flake.lock
      - rust-toolchain.toml

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters cannot tell which output a flake change touches, so a PR runs the
  # bench only if a flake output it runs has a derivation other than its base's.
  changed:
    name: Changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      bench: ${{ steps.diff.outputs.bench }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base.
          fetch-depth: 2

      - uses: ./.github/actions/nix

      - name: Diff
        id: diff
        run: |
          # The trigger's paths, less the flake's and the Nix comparison's, which runs nightly only.
          if ! git diff --quiet HEAD^ HEAD -- bench/build .github/workflows/bench.yml ':!*.md' ':!bench/build/nix*'; then
            echo "bench=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          drvs() { # rev
            local rev drv output
            rev=$(git rev-parse "$1")
            for output in devShells.x86_64-linux.build-bench packages.x86_64-linux.bench-ra-jit; do
              drv=$(nix eval --raw "git+file://$PWD?shallow=1&rev=$rev#$output.drvPath")
              echo "$output $drv"
            done
          }
          drvs HEAD^ >"$RUNNER_TEMP/base"
          drvs HEAD >"$RUNNER_TEMP/head"
          cat "$RUNNER_TEMP/head"
          if diff "$RUNNER_TEMP/base" "$RUNNER_TEMP/head"; then changed=false; else changed=true; fi
          echo "bench=$changed" >>"$GITHUB_OUTPUT"

  bench:
    name: Bench (${{ matrix.name }})
    needs: changed
    # A schedule or dispatch skips the changed job, and runs everything.
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.bench == 'true') }}
    # x86_64 Linux is where rustc links with LLD by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Each job holds a base, its levers, and its control, so every comparison stays on one machine.
      matrix:
        include:
          - name: moq stable
            args: --corpus moq --variant baseline --variant mold --variant wild --variant control --no-attribute
          - name: moq nightly
            args: --corpus moq --variant nightly --variant jobs-frontend --variant cranelift --variant cache-proc-macros --variant nightly-control
          - name: moq ra-jit
            args: --corpus moq --variant ra-jit-baseline --variant ra-jit --no-attribute
          - name: moq pure-crypto
            args: --corpus moq --corpus moq-pure-crypto --variant baseline
          - name: pure
            args: --corpus regex --corpus wasmparser

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Ubuntu hides performance counters from users; hyperfine reads instructions from them.
      - name: Allow perf counters
        run: sudo sysctl -w kernel.perf_event_paranoid=2

      - name: Bench
        run: nix develop .#build-bench --command just bench ${{ matrix.args }} --out bench-results

      - name: Summary
        run: cat bench-results/report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ strategy.job-index }}
          path: bench-results
          if-no-files-found: ignore

  # moq's Nix release builds, each way they could share compilations. It takes
  # hours and informs a choice rather than gating a change, so it runs nightly only.
  nix:
    name: Bench (moq nix)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Each variant builds in a private Nix store, which sandboxes its builds in
      # user namespaces that Ubuntu reserves for root.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Allow perf counters
        run: sudo sysctl -w kernel.perf_event_paranoid=2

      - name: Bench
        run: nix develop .#build-bench --command just bench-nix --out bench-results

      - name: Summary
        run: cat bench-results/report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-nix
          path: bench-results
          if-no-files-found: ignore
