name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  moq:
    name: Translate moq-net
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # moq-net's codec at the pinned moq revision, translated and type-checked.
      - name: Translate
        run: nix develop --command just ts moq

      # The package moq consumes as a flake input.
      - name: Build
        run: nix build .#ts
