name: Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  moq:
    name: Translate moq-net
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # moq-net's codec at the pinned moq revision, translated and type-checked.
      - name: Translate
        run: nix develop --command just ts moq

      # The package moq consumes as a flake input.
      - name: Build
        run: nix build .#ts

  bench:
    name: Benchmark
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Every route in Node, Bun, and Chrome. The numbers go in the run's summary: no
      # threshold fails the job.
      - name: Bench
        run: nix develop .#bench --command just ts bench

      - name: Summary
        run: cat ts/target/bench/report.md >> "$GITHUB_STEP_SUMMARY"
