name: Release

permissions:
  pull-requests: write
  contents: write

# Only one release job can run at a time.
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    # Only a crate change can bump a version.
    paths:
      - "uniffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".release-plz.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    name: Plz
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kixelated' && github.ref == 'refs/heads/main' }}

    steps:
      # A GitHub App token, so the release PR and tag it opens trigger workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./.github/actions/nix

      - name: Release
        run: nix develop --command just release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
