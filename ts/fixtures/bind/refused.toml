# Bindings `ts.toml` can't make: `refused.txt` holds the errors.
package = "bind-fixture"
roots = ["harness::run"]

[bind]
"nowhere::Thing" = "bind/thing.ts"
"std::vec::Vec" = "bind/vec.ts"
"raw" = "bind/raw.ts"
"bytes::Buf" = "bind/buf.ts"
"raw::Tally::get" = { file = "bind/get.ts", drop = true }
"raw::Tally::new" = "rt/tally.ts"
"bytes::BytesMut" = "../bytes.ts"
"bytes::Bytes" = "bind/bytes.ts"
"raw::Tally" = "bind/bytes.ts"
"raw::checksum" = "bind/missing.ts"
