# Bindings `ts.toml` can't make, and what bound items can't do: `refused.txt` holds the
# errors.
package = "bind-fixture"
roots = ["harness::run", "harness::refused"]

[bind]
"nowhere::Thing" = "bind/thing.ts"
"std::vec::Vec" = "bind/vec.ts"
"raw" = "bind/raw.ts"
"bytes::Buf" = "bind/buf.ts"
"raw::Tally::get" = { file = "bind/get.ts", drop = true }
"raw::Tally::new" = "rt/tally.ts"
"raw::Held::new" = "RT/held.ts"
"bytes::BytesMut" = "../bytes.ts"
"bytes::Bytes" = "bind/bytes.ts"
"raw::Tally" = "bind/bytes.ts"
"checksum" = "bind/missing.ts"
"raw::checksum" = "bind/checksum.ts"
"raw::skip" = "bind/skip.ts"
"raw::Held" = "bind/tally.ts"
"raw::zero" = "bind/checksum.ts"
"raw::value" = "bind/checksum.ts"
