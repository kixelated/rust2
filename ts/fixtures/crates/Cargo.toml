[package]
name = "crates-fixture"
description = "A package that translates with a dependency as one program"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[features]
# A module of the dependency's name, whose files would be the dependency's.
shared = []
# The dependency's iterator runs from either end, which translation refuses.
rev = ["crates-dep/rev"]

[dependencies]
crates-dep = { path = "dep" }

[lints]
workspace = true
