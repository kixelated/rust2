[package]
name = "share-fixture"
description = "Copy aggregates rust2-ts copies for a single write, which lang's other writes would hide"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[features]
# Each makes `harness::overwrite` another kind of write, for the fixture's only one.
call = []
pointer = []

[lints]
workspace = true
