[package]
name = "task-fixture"
description = "A kio-shaped channel and async code, to test rust2-ts's futures and drops against native Rust"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[features]
# The wasm32 build exports the benchmark's handoff in place of the harness.
bench = []

[dependencies]
kio = { package = "task-kio", path = "kio" }

[lints]
workspace = true
