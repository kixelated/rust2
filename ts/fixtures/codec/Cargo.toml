[package]
name = "codec-fixture"
description = "moq-net's sync codec, vendored to test rust2-ts against native Rust"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[features]
# moq-net gates its async codec on this; the vendored subset leaves it off.
async = []

[dependencies]
bytes = "1.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true
