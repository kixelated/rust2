[workspace]
# Its own workspace, apart from the repo's: the driver builds on ts/rust-toolchain.toml's
# nightly, which the other projects do not use.
members = ["fixtures/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixelated/rust2"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

[package]
name = "rust2-ts"
description = "Translate a Rust subset to readable TypeScript"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Distributed through the flake: it only builds on the pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
oxc_sourcemap = "9.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.8"

[lints]
workspace = true
