
[package]
name = "rust2-ts"
description = "Translate a Rust subset to readable TypeScript"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Distributed through the flake: it only builds on the pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
# Its own workspace, apart from the repo's: the driver builds on ts/rust-toolchain.toml's
# nightly, which the other projects do not use.
members = ["fixtures/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixelated/rust2"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

[dependencies]
oxc_sourcemap = "9.0.0"
rust2-driver = { path = "../driver" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.8"

[lints]
workspace = true

# moq's profile for moq-wasm, which ships size-optimized: the benchmark's WASM route.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
